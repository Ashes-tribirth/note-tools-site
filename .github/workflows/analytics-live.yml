name: Analytics live checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/analytics-live.yml']
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-live-mobile
          path: live-mobile.png
          retention-days: 7
