<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noteツール一覧</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    color: #1A1A1A;
    background: #FFFFFF;
    line-height: 1.6;
  }

  .header {
    padding: 5rem 2rem 3rem;
    text-align: center;
    border-bottom: 1px solid #EEEEEE;
  }
  .header .eyebrow {
    font-size: 0.8rem;
    color: #A69BD9;
    margin: 0 0 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 600;
  }
  .header h1 {
    font-size: 2.25rem;
    font-weight: 700;
    margin: 0 0 1rem;
    letter-spacing: -0.02em;
  }
  .header p {
    font-size: 0.95rem;
    color: #999;
    max-width: 480px;
    margin: 0 auto;
  }

  .controls {
    padding: 2.5rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  .search-wrap { margin-bottom: 1.5rem; }
  #searchInput {
    width: 100%;
    padding: 0.9rem 1.1rem;
    font-size: 0.95rem;
    border: 1px solid #E4E4E4;
    border-radius: 8px;
    outline: none;
    background: #FAFAFA;
    color: #1A1A1A;
    transition: all 0.2s;
  }
  #searchInput:focus {
    border-color: #A69BD9;
    background: #FFFFFF;
  }

  .filter-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  select {
    padding: 0.65rem 1rem;
    border: 1px solid #E4E4E4;
    border-radius: 6px;
    font-size: 0.85rem;
    background: #FFFFFF;
    color: #444;
    cursor: pointer;
    outline: none;
  }
  #resetBtn {
    padding: 0.65rem 1rem;
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    color: #A69BD9;
    display: none;
    font-weight: 500;
    text-decoration: underline;
  }
  #resultCount {
    margin-left: auto;
    font-size: 0.82rem;
    color: #BBB;
  }

  .grid-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 2rem 5rem;
  }
  #toolsGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1px;
    background: #EEEEEE;
    border: 1px solid #EEEEEE;
  }
  .empty-state, .loading-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem;
    color: #CCC;
    background: white;
  }

  .card {
    text-decoration: none;
    display: block;
    background: white;
  }
  .card-inner {
    padding: 1.75rem;
    height: 100%;
    display: flex;
    flex-direction: column;
    transition: background 0.15s;
  }
  .card-inner:hover { background: #FAFAFA; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.6rem;
    gap: 0.75rem;
  }
  .card-title {
    font-size: 1rem;
    font-weight: 600;
    color: #1A1A1A;
    line-height: 1.4;
  }
  .badge {
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 600;
    flex-shrink: 0;
    border: 1px solid currentColor;
  }
  .card-author {
    font-size: 0.78rem;
    color: #BBB;
    margin-bottom: 0.9rem;
  }
  .card-desc {
    font-size: 0.87rem;
    color: #666;
    margin-bottom: 1.2rem;
    flex: 1;
  }
  .card-category {
    font-size: 0.75rem;
    color: #A69BD9;
    font-weight: 500;
  }

  .footer {
    padding: 2.5rem 2rem;
    text-align: center;
    color: #BBB;
    font-size: 0.8rem;
    border-top: 1px solid #EEEEEE;
  }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">note tools directory</p>
    <h1>noteツール一覧</h1>
    <p>noteクリエイターが作った便利ツールを、探しやすく整理しました。</p>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="ツール名・作者・キーワードで検索">
    </div>
    <div class="filter-row">
      <select id="categoryFilter"><option value="">すべてのカテゴリ</option></select>
      <select id="statusFilter"><option value="">すべてのステータス</option></select>
      <button id="resetBtn">条件をクリア</button>
      <span id="resultCount"></span>
    </div>
  </div>

  <div class="grid-wrap">
    <div id="toolsGrid">
      <div class="loading-state">読み込み中...</div>
    </div>
  </div>

  <div class="footer">
    <p>noteクリエイターが作成したツールをまとめています</p>
    <p>最終更新: 2026-08-03</p>
  </div>

<script>
let allTools = [];

function statusLabel(status) {
  if (status.includes('無料')) return { text: '無料', color: '#3A8A5E' };
  if (status.includes('有料')) return { text: '有料', color: '#B8722E' };
  if (status.includes('開発中')) return { text: '開発中', color: '#8B5FBF' };
  if (status.includes('メンバーシップ')) return { text: '限定', color: '#3B6FA6' };
  return { text: status, color: '#888' };
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (inQuotes) {
      if (char === '"' && next === '"') { field += '"'; i++; }
      else if (char === '"') { inQuotes = false; }
      else { field += char; }
    } else {
      if (char === '"') { inQuotes = true; }
      else if (char === ',') { row.push(field); field = ''; }
      else if (char === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (char === '\r') { }
      else { field += char; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

async function loadTools() {
  try {
    const csvPath = './note%20tools.csv';
    console.log('Fetching CSV from:', csvPath);
    
    const response = await fetch(csvPath);
    console.log('Fetch response status:', response.status);
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const csvText = await response.text();
    console.log('CSV loaded, length:', csvText.length);
    
    const rows = parseCSV(csvText).filter(r => r.some(cell => cell.trim() !== ''));
    console.log('Parsed rows:', rows.length);

    allTools = rows.slice(1).map(r => ({
      name: (r[0] || '').trim(),
      author: (r[1] || '').trim(),
      category: (r[2] || '').trim(),
      description: (r[3] || '').trim(),
      status: (r[4] || '').trim(),
      link: (r[5] || '').trim()
    }));

    console.log('Tools loaded:', allTools.length);

    const categories = [...new Set(allTools.map(t => t.category))].filter(Boolean).sort();
    const statuses = [...new Set(allTools.map(t => t.status))].filter(Boolean).sort();

    const categorySelect = document.getElementById('categoryFilter');
    categories.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat;
      option.textContent = `${cat} (${allTools.filter(t => t.category === cat).length})`;
      categorySelect.appendChild(option);
    });

    const statusSelect = document.getElementById('statusFilter');
    statuses.forEach(status => {
      const option = document.createElement('option');
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    renderTools();
    attachListeners();
  } catch (error) {
    console.error('Error loading tools:', error);
    document.getElementById('toolsGrid').innerHTML =
      `<div class="empty-state">データの読み込みに失敗しました。<br>エラー: ${error.message}</div>`;
  }
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTools() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categoryFilter').value;
  const status = document.getElementById('statusFilter').value;

  const filtered = allTools.filter(tool => {
    const matchSearch = tool.name.toLowerCase().includes(searchTerm) ||
                       tool.author.toLowerCase().includes(searchTerm) ||
                       tool.description.toLowerCase().includes(searchTerm);
    const matchCategory = !category || tool.category === category;
    const matchStatus = !status || tool.status === status;
    return matchSearch && matchCategory && matchStatus;
  });

  document.getElementById('resultCount').textContent = `${filtered.length} 件`;
  document.getElementById('resetBtn').style.display = (searchTerm || category || status) ? 'inline-block' : 'none';

  const grid = document.getElementById('toolsGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">該当するツールが見つかりません</div>';
    return;
  }

  grid.innerHTML = filtered.map((tool) => {
    const st = statusLabel(tool.status);
    return `
    <a class="card" href="${escapeHTML(tool.link)}" target="_blank" rel="noopener noreferrer">
      <div class="card-inner">
        <div class="card-top">
          <div class="card-title">${escapeHTML(tool.name)}</div>
          <span class="badge" style="color:${st.color};">${escapeHTML(st.text)}</span>
        </div>
        <div class="card-author">${escapeHTML(tool.author)}</div>
        <div class="card-desc">${escapeHTML(tool.description)}</div>
        <div class="card-category">${escapeHTML(tool.category)}</div>
      </div>
    </a>
    `;
  }).join('');
}

function attachListeners() {
  document.getElementById('searchInput').addEventListener('input', renderTools);
  document.getElementById('categoryFilter').addEventListener('change', renderTools);
  document.getElementById('statusFilter').addEventListener('change', renderTools);
  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('categoryFilter').value = '';
    document.getElementById('statusFilter').value = '';
    renderTools();
  });
}

loadTools();
</script>
</body>
</html>
