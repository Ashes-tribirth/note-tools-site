<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新履歴プレビュー</title>
  <style>
    body {
      margin: 0;
      background: #F8F7FB;
      color: #1A1A1A;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .controls {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    .lead {
      margin: 0 0 1.25rem;
      color: #6F6878;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .update-log {
      margin-bottom: 1.1rem;
      padding: 0.85rem 0.95rem;
      border: 1px solid #E9E6F1;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      color: #6F6878;
    }

    .update-log h2 {
      margin: 0 0 0.35rem;
      color: #5F5868;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .update-log-list {
      max-height: 5.25rem;
      overflow-y: auto;
      padding-right: 0.35rem;
    }

    .update-log-list p {
      display: flex;
      gap: 0.8rem;
      align-items: baseline;
      min-height: 1.75rem;
      margin: 0;
      border-top: 1px solid #F1EEF6;
      font-size: 0.8rem;
    }

    .update-log-list p:first-child { border-top: 0; }

    .update-log-list time {
      flex: 0 0 4.5rem;
      color: #8D8498;
      font-weight: 700;
    }

    .search-wrap { margin-bottom: 1.5rem; }

    #searchInput {
      width: 100%;
      box-sizing: border-box;
      padding: 0.9rem 1.1rem;
      border: 1px solid #E4E4E4;
      border-radius: 8px;
      outline: none;
      background: #FAFAFA;
      color: #1A1A1A;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="controls">
    <p class="lead">noteクリエイター向け便利ツールを探すための一覧です。</p>

    <section class="update-log" aria-labelledby="updateLogTitle">
      <h2 id="updateLogTitle">最近の更新</h2>
      <div class="update-log-list" tabindex="0" aria-live="polite">
        <p><time datetime="2026-08-12">26/08/12</time><span>追加1件　更新3件　機能追加：更新履歴</span></p>
        <p><time datetime="2026-08-09">26/08/09</time><span>追加3件　更新2件</span></p>
        <p><time datetime="2026-08-07">26/08/07</time><span>機能追加：サムネ表示切替・お気に入り・設定保存</span></p>
        <p><time datetime="2026-08-05">26/08/05</time><span>サイト公開</span></p>
      </div>
    </section>

    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="ツール名・作者・キーワードで検索">
    </div>
  </main>
</body>
</html>
